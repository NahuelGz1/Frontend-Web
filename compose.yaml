services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cine_paradiso
      MYSQL_USER: cine_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configurá MYSQL_PASSWORD en .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurá MYSQL_ROOT_PASSWORD en .env.docker}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Backend_Api/app/db/init_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../Backend_Api/app/db/catalogo_servicios.sql:/docker-entrypoint-initdb.d/02-servicios.sql:ro
      - ../Backend_Api/app/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ../Backend_Api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: cine_paradiso
      DB_USER: cine_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configurá MYSQL_PASSWORD en .env.docker}
      AUTO_MIGRATE: "true"
      AUTO_SEED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configurá JWT_SECRET_KEY en .env.docker}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PASSWORD_RESET_URL: ${FRONTEND_URL:-http://localhost:3000}/auth/restablecer-contrasena
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@cine-paradiso.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/ping', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configurá SECRET_KEY en .env.docker}
      API_BASE_URL: http://backend:5000/api
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
