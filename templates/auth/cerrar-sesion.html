{% extends "layouts/base.html" %}
{% block title %}Cerrar sesión · Cine Paradiso{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="cerrar-titulo">
    <h1 id="cerrar-titulo">Cerrar sesión</h1>
    <p>¿Querés cerrar tu sesión en este dispositivo?</p>
    <form class="login-form" method="POST" action="{{ url_for('auth_views.cerrar_sesion') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="login-submit" type="submit">Cerrar sesión</button>
    </form>
    <a href="{{ url_for('cliente_views.inicio') }}">Volver al inicio</a>
</section>
{% endblock %}
